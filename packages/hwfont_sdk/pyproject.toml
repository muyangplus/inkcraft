[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwfont-sdk"
version = "1.0.0"
description = "Shared .hwfont SQLite single-line handwriting font codec, reader, writer, and verifier."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hwfont_sdk*"]
